services:
  web:
    build: .
    image: ooo-trace-reviewer:latest
    environment:
      PORT: "8080"
    ports:
      # Configurable host port: WEB_PORT=9090 docker compose up web
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8080')+'/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  verify:
    image: ooo-trace-reviewer:latest
    build: .
    environment:
      TARGET_URL: "http://web:8080"
      PORT: "8080"
    depends_on:
      web:
        condition: service_healthy
    # Runs build check + unit/API tests + HTTP smoke, then exits with the
    # gate result code (0 = pass).
    entrypoint: ["bash", "scripts/verify.sh"]
    restart: "no"
